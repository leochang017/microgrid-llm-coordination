name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Lint with ruff
        run: ruff check sim tests scripts

      - name: Type-check with mypy
        run: mypy

      - name: Run tests
        run: pytest -v

  # The web demo (web/) is a standalone SvelteKit static app — it is NOT part of the
  # Python package and has no Python dependency, so it gets its own job rather than
  # extra steps on `test`. Its gate is svelte-check + a real production build (the
  # build is what proves all five prerender entries still resolve); there is no JS
  # test suite, TDD in this repo is Python-only.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 is what the app was developed and verified against locally, and it
      # clears Vite 8's floor (`^20.19.0 || >=22.12.0`).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check with svelte-check
        run: npm run check

      - name: Build
        run: npm run build
