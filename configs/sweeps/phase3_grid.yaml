# Phase 3 dose-response grid (spec Part D; base = the solar showcase).
# Each axis is swept independently: base + {set: value} x strategies x seeds.
# round_robin rows SHOULD be flat across every axis — rule-based baselines
# read engine truth and are structurally immune to the information-quality
# failure modes; the flat row is the paper's evidence for that claim.
# llm_agent is deliberately absent: live cells are budget-gated (spec Part E).
# Run:  python -m scripts.sweep --grid configs/sweeps/phase3_grid.yaml
name: phase3_grid
scenario: configs/scenarios/haves_havenots_solar__llm.yaml
strategies: [round_robin, llm_fallback]
seeds: [23, 1, 7, 42, 99]
axes:
  - name: defector_fraction
    set: failure_modes.defector_fraction
    values: [0.0, 0.1, 0.2, 0.4]
  - name: noise_soc_std
    set: failure_modes.obs_noise.soc_std_frac
    values: [0.0, 0.05, 0.1, 0.2]
  - name: comm_budget
    set: failure_modes.comm.per_tick_budget
    values: [null, 4, 2, 1]
