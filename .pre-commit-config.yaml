repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(sim|tests|scripts)/.*\.py$
      - id: ruff-format
        files: ^(sim|tests|scripts)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^sim/.*\.py$
        additional_dependencies:
          - types-pyyaml
          - numpy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # 15 MB accommodates Phase 3.2 reference_runs/ messages.jsonl traces.
        # History: 500 KB was too small for whole-run message logs; 5 MB fit
        # Phase 2's 12 h cells (2.2 MB) but NOT the 24 h solar showcase, whose
        # $0 control trace already measures 6.4 MB (17,696 rows) — live cells
        # are larger still (LLM rationales are longer than templated ones).
        args: [--maxkb=15000]
