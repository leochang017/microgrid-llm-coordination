[project]
name = "microgrid-sim"
version = "0.1.0"
description = "LLM-agent peer-to-peer coordination simulator for residential microgrids."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "anthropic>=0.40",
    # sim/agents/llm.py imports httpx directly (httpx.Timeout). It ships as an
    # anthropic dependency today, but importing a transitive dep without
    # declaring it is exactly how Tasks 11-14 shipped red CI in May — declare
    # what we import.
    "httpx>=0.27",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=16.0", "requests>=2.32"]  # pyarrow: pd.read_parquet engine (resstock adapter) — no direct import, do not "clean up"
viz = ["matplotlib>=3.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0", "pre-commit>=4.0"]

[tool.setuptools.packages.find]
include = ["sim*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sim", "scripts"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
